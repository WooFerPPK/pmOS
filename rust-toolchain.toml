[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
# wasm32-unknown-unknown (for the kernel) and wasm32-wasip1 (for
# userland crates once they start compiling) are added via
# `rustup target add` AFTER the base toolchain is installed.
# Listing them here makes rustup attempt a full component
# download on every cargo invocation, which fails reliably in
# constrained environments on the libLLVM.so extraction step.
profile = "minimal"
