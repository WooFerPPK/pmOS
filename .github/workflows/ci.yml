name: ci

on:
  push:
    branches: [main, master, '001-*']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: just test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned via rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add wasm32-unknown-unknown wasm32-wasip1
          rustc --version
          cargo --version

      - name: Install just
        run: cargo install just --locked

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers
        run: |
          just node-deps
          cd web
          npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
        # Deliberately NOT caching `target/`. Cached target artifacts
        # between runs have caused stale wasm binaries to survive
        # source changes (cargo fingerprint + restored mtimes interact
        # in unpredictable ways across cache hits), producing test
        # failures against behaviourally-old hello-* binaries. Full
        # fresh builds are ~2 minutes and safer.

      - name: Run complete build and test gate
        run: just test
