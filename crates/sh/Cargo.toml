[package]
name = "sh"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sh"
path = "src/lib.rs"

[[bin]]
name = "sh"
path = "src/main.rs"

[features]
# `std` adds the `run` REPL driver (see `crates/sh/src/run.rs`).
# Default-on so `cargo test -p sh` and the userland `sh` binary
# both pick it up without extra flags. `no_std + alloc` consumers
# (embedding `Shell::eval` into a restricted environment) can
# `default-features = false` and keep using the tokenizer + shell
# state machine without the REPL layer.
default = ["std"]
std = []

[dependencies]
abi = { path = "../abi" }
