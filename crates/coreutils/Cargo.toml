[package]
name = "coreutils"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared library entry reserved for helpers once multiple coreutils
# ship. For the cat-only slice it is effectively empty but kept so
# future binaries (ls, grep, mkdir, rm, cp, mv) can land without
# reshaping the crate.

[lib]
name = "coreutils"
path = "src/lib.rs"

[[bin]]
name = "cat"
path = "src/bin/cat.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[[bin]]
name = "cp"
path = "src/bin/cp.rs"

[[bin]]
name = "mkdir"
path = "src/bin/mkdir.rs"

[[bin]]
name = "rm"
path = "src/bin/rm.rs"

[[bin]]
name = "mv"
path = "src/bin/mv.rs"

[[bin]]
name = "ls"
path = "src/bin/ls.rs"

[[bin]]
name = "wc"
path = "src/bin/wc.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"
