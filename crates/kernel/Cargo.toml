[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"
# The kernel compiles to both a cdylib (for the WASM runtime target)
# and a rlib (for native `cargo test` via the Platform abstraction).
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
abi = { path = "../abi" }
ring = { path = "../ring" }

[features]
# `native-platform` is **on by default** so that `cargo test -p kernel`
# just works on the developer's host without extra flags. The wasm32
# runtime build must pass `--no-default-features` to disable it
# (handled by the Justfile's `build` target).
default = ["native-platform"]
# Enable the native Platform implementation for host-target test runs.
native-platform = []
