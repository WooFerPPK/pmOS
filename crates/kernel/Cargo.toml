[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
# Kernel has no binary target. For wasm32-unknown-unknown the cdylib
# *is* the deployable artefact — the browser instantiates `kernel.wasm`
# and calls exported functions; there is no `fn main()` path. For
# native (`cargo test --features native-platform`) the rlib is what
# the test crates link against. Disable autobin so Cargo doesn't
# pick up a stray `src/main.rs` and reintroduce the filename
# collision that plagued the pre-wasip1 build.
autobins = false

[lib]
path = "src/lib.rs"
# The kernel compiles to both a cdylib (for the WASM runtime target)
# and a rlib (for native `cargo test` via the Platform abstraction).
crate-type = ["cdylib", "rlib"]

[dependencies]
abi = { path = "../abi" }
ring = { path = "../ring" }

[features]
# `native-platform` is **on by default** so that `cargo test -p kernel`
# just works on the developer's host without extra flags. The wasm32
# runtime build must pass `--no-default-features` to disable it
# (handled by the Justfile's `build` target).
default = ["native-platform"]
# Enable the native Platform implementation for host-target test runs.
native-platform = []
