[package]
name = "integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# Host-target only. Do NOT compile for wasm; this crate exists so
# native Rust can drive full-stack perf harnesses with timing
# precision that the Playwright JS layer cannot provide (see I6 fix
# and T220). Rust-native binaries live in src/bin/ and are added by
# the tasks that need them.
[dependencies]

[dev-dependencies]
# Cross-crate integration tests pull in every layer they
# need to compose. These are dev-dependencies (not regular
# deps) so production builds that happen to consume this
# crate don't drag the entire workspace in.
abi = { path = "../abi" }
kernel = { path = "../kernel", features = ["native-platform"] }
display-proto = { path = "../display-proto" }
display-server = { path = "../display-server" }
toolkit = { path = "../toolkit" }
toolkit-free-client = { path = "../toolkit-free-client" }
sh = { path = "../sh" }
shell = { path = "../shell" }
term = { path = "../term" }
