[package]
name = "display-server-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
# Same pattern as the other `hello-*` / `ipc-self-test` crates:
# no_std cdylib, cfg-gated on `target_arch = "wasm32"` so
# `cargo test --workspace` sees a native-target no-op and the
# workspace builds against only one target per crate.

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]
